name: 'muster conformance'
description: 'Run muster agent-file conformance checks (Soul.md, Skills, SOP, TOOLS, memory, A2A) in CI.'
author: 'garrison-hq'
branding:
  icon: 'check-circle'
  color: 'purple'

inputs:
  command:
    description: 'The muster subcommand to run, e.g. "check", "cts run", "a2a run", "skills run", "sop run".'
    required: true
  args:
    description: 'Positional argument(s) for the command: a manifest path, file, or glob.'
    required: false
    default: ''
  version:
    description: 'npm version or range of @garrison-hq/muster to run (passed to npx).'
    required: false
    default: '^1.1.0'
  endpoint:
    description: 'A2A endpoint base URL for live behavioral cases. Sets MUSTER_A2A_ENDPOINT. Leave empty to skip live A2A cases.'
    required: false
    default: ''
  token:
    description: 'Bearer token for the A2A endpoint (pass a secret). Sets MUSTER_A2A_TOKEN. Never logged.'
    required: false
    default: ''
  model-endpoint:
    description: 'BYOM endpoint base URL for live behavioral cases (skills/sop/crosslayer/memory-utilization). Sets MUSTER_ENDPOINT. Leave empty to skip live behavioral cases.'
    required: false
    default: ''
  model:
    description: 'Model identifier passed through to MUSTER_MODEL.'
    required: false
    default: ''
  api-key:
    description: 'API key for the BYOM endpoint (pass a secret). Sets MUSTER_API_KEY. Never logged.'
    required: false
    default: ''
  health-url:
    description: 'Readiness probe URL (e.g. <endpoint>/.well-known/agent-card.json). Polled until it returns 200 before muster runs.'
    required: false
    default: ''
  health-timeout:
    description: 'Seconds to wait for health-url to return 200.'
    required: false
    default: '60'
  annotations:
    description: "Emit an inline workflow error annotation on failure ('true' or 'false')."
    required: false
    default: 'true'
  fail-on:
    description: "'error' fails the job when muster exits non-zero; 'never' reports via outputs but never fails the step."
    required: false
    default: 'error'
  node-version:
    description: 'Node.js version to use (muster requires >=22).'
    required: false
    default: '22'
  working-directory:
    description: 'Directory to run muster in.'
    required: false
    default: '.'

outputs:
  exit-code:
    description: 'The raw muster exit code (0 pass/skip, 1 conformance failure, 2 internal/endpoint error).'
    value: ${{ steps.run.outputs.exit-code }}
  result:
    description: "'passed' | 'failed' | 'errored' | 'skipped'."
    value: ${{ steps.run.outputs.result }}

runs:
  using: 'composite'
  steps:
    - name: Set up Node ${{ inputs.node-version }}
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Wait for endpoint readiness
      if: ${{ inputs.health-url != '' }}
      shell: bash
      run: ${{ github.action_path }}/scripts/wait-health.sh
      env:
        HEALTH_URL: ${{ inputs.health-url }}
        HEALTH_TIMEOUT: ${{ inputs.health-timeout }}

    - name: Run muster
      id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: ${{ github.action_path }}/scripts/run.sh
      env:
        MA_COMMAND: ${{ inputs.command }}
        MA_ARGS: ${{ inputs.args }}
        MA_VERSION: ${{ inputs.version }}
        MA_ANNOTATIONS: ${{ inputs.annotations }}
        MA_FAIL_ON: ${{ inputs.fail-on }}
        MUSTER_A2A_ENDPOINT: ${{ inputs.endpoint }}
        MUSTER_A2A_TOKEN: ${{ inputs.token }}
        MUSTER_ENDPOINT: ${{ inputs.model-endpoint }}
        MUSTER_MODEL: ${{ inputs.model }}
        MUSTER_API_KEY: ${{ inputs.api-key }}
