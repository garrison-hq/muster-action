name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-pass:
    name: check a valid Soul.md (expect pass)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - id: muster
        uses: ./
        with:
          command: check
          args: tests/fixtures/Soul.md
      - name: assert passed
        run: |
          echo "result=${{ steps.muster.outputs.result }} exit=${{ steps.muster.outputs.exit-code }}"
          test "${{ steps.muster.outputs.result }}" = "passed"
          test "${{ steps.muster.outputs.exit-code }}" = "0"

  static-fail:
    name: check a broken Soul.md (expect failure, reported not thrown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - id: muster
        uses: ./
        with:
          command: check
          args: tests/fixtures/Soul.broken.md
          fail-on: never # report via outputs; do not fail the step
      - name: assert failed with exit 1
        run: |
          echo "result=${{ steps.muster.outputs.result }} exit=${{ steps.muster.outputs.exit-code }}"
          test "${{ steps.muster.outputs.result }}" = "failed"
          test "${{ steps.muster.outputs.exit-code }}" = "1"

  a2a-skip:
    name: a2a behavioral with no endpoint (expect skip, exit 0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - id: muster
        uses: ./
        with:
          command: a2a run
          args: tests/fixtures/a2a-behavioral.yaml
          # no endpoint → muster skips live cases
      - name: assert skipped, exit 0
        run: |
          echo "result=${{ steps.muster.outputs.result }} exit=${{ steps.muster.outputs.exit-code }}"
          test "${{ steps.muster.outputs.exit-code }}" = "0"
          test "${{ steps.muster.outputs.result }}" = "skipped"

  # --- WP04 (FR-005): BYOM-triple exit-path matrix, T021-T027 ---
  # Shared fixture: tests/fixtures/behavioral-single-case.yaml (T021 step 3),
  # reusing WP02's already schema-verified tests/fixtures/skills-anchor/ +
  # tests/fixtures/skills-anchor-queries.yaml read-only (F-7).

  byom-all-empty:
    name: 'FR-005(a): all BYOM empty (expect skipped, exit 0)'
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.muster.outputs.result }}
      exit-code: ${{ steps.muster.outputs.exit-code }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - id: muster
        uses: ./
        with:
          command: skills run
          args: tests/fixtures/behavioral-single-case.yaml
          version: '1.2.0'
          # model-endpoint/model/api-key all left at default (empty)
          fail-on: never
      - name: assert skipped, exit 0
        run: |
          echo "result=${{ steps.muster.outputs.result }} exit=${{ steps.muster.outputs.exit-code }}"
          test "${{ steps.muster.outputs.result }}" = "skipped"
          test "${{ steps.muster.outputs.exit-code }}" = "0"

  byom-dead-endpoint:
    name: 'FR-005(b): dead endpoint (mandated negative-path run, expect failed, exit 1)'
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.muster.outputs.result }}
      exit-code: ${{ steps.muster.outputs.exit-code }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - id: muster
        uses: ./
        with:
          command: skills run
          args: tests/fixtures/behavioral-single-case.yaml
          model-endpoint: http://127.0.0.1:9 # guaranteed connection-refused
          version: '1.2.0'
          fail-on: never
      - name: assert failed, exit 1
        run: |
          echo "result=${{ steps.muster.outputs.result }} exit=${{ steps.muster.outputs.exit-code }}"
          test "${{ steps.muster.outputs.result }}" = "failed"
          test "${{ steps.muster.outputs.exit-code }}" = "1"

  byom-missing-key:
    name: 'FR-005(c): missing key, endpoint set (expect failed, exit 1)'
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.muster.outputs.result }}
      exit-code: ${{ steps.muster.outputs.exit-code }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: assert ambient OPENAI_API_KEY is absent
        run: |
          if [ -n "${OPENAI_API_KEY:-}" ]; then
            echo "::error::OPENAI_API_KEY unexpectedly present in runner env; this case requires it absent"
            exit 1
          fi
          echo "confirmed: OPENAI_API_KEY absent"
      - id: muster
        uses: ./
        with:
          command: skills run
          args: tests/fixtures/behavioral-single-case.yaml
          model-endpoint: http://127.0.0.1:9 # real-looking, not necessarily reachable
          api-key: ''
          version: '1.2.0'
          fail-on: never
      - name: assert failed, exit 1 (not 2 -- skip decision keys on endpoint, not key)
        run: |
          echo "result=${{ steps.muster.outputs.result }} exit=${{ steps.muster.outputs.exit-code }}"
          test "${{ steps.muster.outputs.result }}" = "failed"
          test "${{ steps.muster.outputs.exit-code }}" = "1"

  byom-malformed-manifest:
    name: 'FR-005(d): malformed manifest (expect errored, exit 2)'
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.muster.outputs.result }}
      exit-code: ${{ steps.muster.outputs.exit-code }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - id: muster
        uses: ./
        with:
          command: skills run
          args: tests/fixtures/malformed-manifest.yaml
          model-endpoint: http://127.0.0.1:9 # irrelevant -- failure is at manifest-read time
          # no version pin: manifest read/parse failure is not M5-specific (Context note)
          fail-on: never
      - name: assert errored, exit 2, and that it is a genuine parse failure (not a missing file)
        run: |
          echo "result=${{ steps.muster.outputs.result }} exit=${{ steps.muster.outputs.exit-code }}"
          test "${{ steps.muster.outputs.result }}" = "errored"
          test "${{ steps.muster.outputs.exit-code }}" = "2"
          # A missing fixture ALSO reports errored/2 (ENOENT) -- that would be this
          # case passing for the wrong reason. Require the report show a genuine
          # parse failure, not a not-found error.
          if command grep -q "ENOENT" "${{ steps.muster.outputs.report-file }}"; then
            echo "::error::exit 2 came from a missing file, not a malformed-YAML parse failure"
            exit 1
          fi

  byom-cross-check:
    name: 'FR-005/SC-003: no silent-green collapse, only (d) yields exit 2 (T026)'
    needs: [byom-all-empty, byom-dead-endpoint, byom-missing-key, byom-malformed-manifest]
    runs-on: ubuntu-latest
    steps:
      - name: assert none of a-d is passed/0, exactly (d) yields exit 2
        run: |
          declare -A outcomes=(
            [a]="${{ needs.byom-all-empty.outputs.result }}:${{ needs.byom-all-empty.outputs.exit-code }}"
            [b]="${{ needs.byom-dead-endpoint.outputs.result }}:${{ needs.byom-dead-endpoint.outputs.exit-code }}"
            [c]="${{ needs.byom-missing-key.outputs.result }}:${{ needs.byom-missing-key.outputs.exit-code }}"
            [d]="${{ needs.byom-malformed-manifest.outputs.result }}:${{ needs.byom-malformed-manifest.outputs.exit-code }}"
          )
          echo "case outcomes: ${outcomes[a]} ${outcomes[b]} ${outcomes[c]} ${outcomes[d]}"
          exit2_count=0
          for case_id in a b c d; do
            entry="${outcomes[$case_id]}"
            result="${entry%%:*}"
            code="${entry##*:}"
            if [ "$result" = "passed" ] && [ "$code" = "0" ]; then
              echo "::error::case ${case_id} reported passed/0 -- none of (a)-(d) is a genuine pass"
              exit 1
            fi
            if [ "$code" = "2" ]; then
              exit2_count=$((exit2_count + 1))
              if [ "$case_id" != "d" ]; then
                echo "::error::case ${case_id} reported exit 2 -- only case (d) may"
                exit 1
              fi
            fi
          done
          if [ "$exit2_count" -ne 1 ]; then
            echo "::error::expected exactly one case ((d)) to report exit 2, got ${exit2_count}"
            exit 1
          fi
          echo "cross-check OK: none passed/0, exactly case (d) yielded exit 2"

  # --- WP04 T028 [Gap closure]: WP02's exact report-file + anchored-marker
  # conjunction recipe, wired as a real job this repo's own CI executes.
  # Reuses WP02's fixture read-only (tests/fixtures/skills-control-anchor.yaml,
  # tests/fixtures/skills-anchor/, tests/fixtures/stub-endpoint.js) -- no new
  # fixture files added for this job (F-7).

  skills-conjunction-regression:
    name: 'FR-004/User Story 3: report-file conjunction regression (T028)'
    runs-on: ubuntu-latest
    env:
      STUB_PORT: '18337'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - name: Start stub model endpoint
        run: node tests/fixtures/stub-endpoint.js &
      - name: Wait for stub readiness (F-5 -- poll, do not race the background start)
        run: |
          for _ in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:${STUB_PORT}/chat/completions" -X POST -d '{}' >/dev/null 2>&1; then
              echo "stub ready on port ${STUB_PORT}"
              exit 0
            fi
            sleep 1
          done
          echo "::error::stub-endpoint.js did not become ready on port ${STUB_PORT} within 30s"
          exit 1
      - name: Run muster (healthy endpoint, control-inversion fixture)
        id: muster-healthy
        uses: ./
        with:
          command: skills run
          args: tests/fixtures/skills-control-anchor.yaml
          model-endpoint: http://127.0.0.1:18337
          model: fake
          api-key: fake-value
          version: '1.2.0'
          fail-on: never
      - name: Assert healthy conjunction (ordinary PASS, control FAIL)
        run: |
          report_file="${{ steps.muster-healthy.outputs.report-file }}"
          command grep -qxF '  [PASS] case-1' "$report_file" \
            && command grep -qxF '  [FAIL] case-1-control' "$report_file"
      - name: Run muster (dead-endpoint falsification, same fixture)
        id: muster-dead
        uses: ./
        with:
          command: skills run
          args: tests/fixtures/skills-control-anchor.yaml
          model-endpoint: http://127.0.0.1:19999 # distinct, unbound port -- avoid matrix-leg collisions
          model: fake
          api-key: fake-value
          version: '1.2.0'
          fail-on: never
      - name: Assert falsification (dead endpoint flips case-1's own marker to FAIL)
        run: |
          report_file="${{ steps.muster-dead.outputs.report-file }}"
          command grep -qxF '  [FAIL] case-1' "$report_file"
